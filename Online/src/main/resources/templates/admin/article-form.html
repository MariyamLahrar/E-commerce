<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Article')}"></head>
<body>
<div class="admin-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <span style="font-size:2rem;">🛍</span>
            <div>
                <div class="sidebar-brand-name">ÉléganceShop</div>
                <div class="sidebar-brand-sub">Administration</div>
            </div>
        </div>
        <nav class="sidebar-menu">
            <div class="sidebar-section-title">Principal</div>
            <a th:href="@{/admin/dashboard}" class="sidebar-item">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a th:href="@{/shop}" class="sidebar-item">
                <i class="bi bi-grid"></i> Voir la boutique
            </a>
            <div class="sidebar-section-title">Gestion</div>
            <a th:href="@{/admin/articles}" class="sidebar-item active">
                <i class="bi bi-box-seam"></i> Articles
            </a>
            <a th:href="@{/admin/users}" class="sidebar-item">
                <i class="bi bi-people"></i> Utilisateurs
            </a>
            <a th:href="@{/admin/orders}" class="sidebar-item">
                <i class="bi bi-bag"></i> Commandes
            </a>
        </nav>
        <div class="sidebar-logout">
            <form th:action="@{/logout}" method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button type="submit"
                        class="sidebar-item border-0 bg-transparent w-100 text-start">
                    <i class="bi bi-box-arrow-right"></i> Déconnexion
                </button>
            </form>
        </div>
    </aside>

    <div class="admin-content-area">
        <div class="admin-topbar">
            <div>
                <h1 class="admin-page-title"
                    th:text="${articleDTO.id == null} ? '➕ Nouvel article' : '✏️ Modifier l\'article'">
                    Article
                </h1>
                <p class="admin-page-sub">Remplissez les informations de l'article</p>
            </div>
            <a th:href="@{/admin/articles}" class="btn btn-light rounded-pill">
                <i class="bi bi-arrow-left me-2"></i>Retour
            </a>
        </div>

        <div class="admin-body">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card-custom p-4">
                        <form th:action="${articleDTO.id == null}
                              ? @{/admin/articles/new}
                              : @{/admin/articles/edit/{id}(id=${articleDTO.id})}"
                              method="post" th:object="${articleDTO}">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>

                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-600">
                                        Nom de l'article *
                                    </label>
                                    <input type="text" class="form-control form-control-custom"
                                           th:field="*{name}"
                                           placeholder="Ex: iPhone 15 Pro" required/>
                                    <div class="field-error"
                                         th:if="${#fields.hasErrors('name')}"
                                         th:errors="*{name}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-600">Marque</label>
                                    <input type="text" class="form-control form-control-custom"
                                           th:field="*{brand}" placeholder="Ex: Apple"/>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-600">Catégorie</label>
                                    <input type="text" class="form-control form-control-custom"
                                           th:field="*{category}"
                                           placeholder="Ex: Téléphonie"
                                           list="categoriesList"/>
                                    <datalist id="categoriesList">
                                        <option th:each="cat : ${categories}"
                                                th:value="${cat}"/>
                                    </datalist>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-600">Prix (€) *</label>
                                    <input type="number"
                                           class="form-control form-control-custom"
                                           th:field="*{price}"
                                           step="0.01" min="0"
                                           placeholder="0.00" required/>
                                    <div class="field-error"
                                         th:if="${#fields.hasErrors('price')}"
                                         th:errors="*{price}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-600">Stock *</label>
                                    <input type="number"
                                           class="form-control form-control-custom"
                                           th:field="*{stock}" min="0"
                                           placeholder="0" required/>
                                    <div class="field-error"
                                         th:if="${#fields.hasErrors('stock')}"
                                         th:errors="*{stock}"></div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-600">Description</label>
                                    <textarea class="form-control form-control-custom"
                                              th:field="*{description}" rows="4"
                                              placeholder="Description détaillée..."></textarea>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-600">URL de l'image</label>
                                    <input type="url"
                                           class="form-control form-control-custom"
                                           th:field="*{imageUrl}"
                                           placeholder="https://..."
                                           id="imgUrl"
                                           oninput="previewImg(this.value)"/>
                                    <div class="mt-2">
                                        <img id="imgPreview"
                                             th:src="${articleDTO.imageUrl}"
                                             style="height:100px;width:140px;object-fit:cover;border-radius:12px;border:2px solid #f9a8c9;"
                                             th:style="${articleDTO.imageUrl == null or articleDTO.imageUrl.isEmpty()} ? 'display:none;height:100px;width:140px;object-fit:cover;border-radius:12px;border:2px solid #f9a8c9;' : 'height:100px;width:140px;object-fit:cover;border-radius:12px;border:2px solid #f9a8c9;'"
                                             onerror="this.style.display='none'"/>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:field="*{active}"
                                               id="activeCheck"/>
                                        <label class="form-check-label fw-600"
                                               for="activeCheck">
                                            Article actif (visible en boutique)
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-3 mt-4">
                                <button type="submit"
                                        class="btn btn-primary-custom btn-lg">
                                    <i class="bi bi-check-lg me-2"></i>
                                    <span th:text="${articleDTO.id == null}
                               ? 'Créer l\'article' : 'Enregistrer'">
                    Sauvegarder
                  </span>
                                </button>
                                <a th:href="@{/admin/articles}"
                                   class="btn btn-light btn-lg rounded-pill">
                                    Annuler
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    function previewImg(url) {
        const img = document.getElementById('imgPreview');
        if (url) { img.src = url; img.style.display = 'block'; }
        else      { img.style.display = 'none'; }
    }
</script>
</body>
</html>
