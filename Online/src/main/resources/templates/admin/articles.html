<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gestion Articles')}"></head>
<body>
<div class="admin-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <span style="font-size:2rem;">🛍</span>
            <div>
                <div class="sidebar-brand-name">ÉléganceShop</div>
                <div class="sidebar-brand-sub">Administration</div>
            </div>
        </div>
        <nav class="sidebar-menu">
            <div class="sidebar-section-title">Principal</div>
            <a th:href="@{/admin/dashboard}" class="sidebar-item">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a th:href="@{/shop}" class="sidebar-item">
                <i class="bi bi-grid"></i> Voir la boutique
            </a>
            <div class="sidebar-section-title">Gestion</div>
            <a th:href="@{/admin/articles}" class="sidebar-item active">
                <i class="bi bi-box-seam"></i> Articles
            </a>
            <a th:href="@{/admin/users}" class="sidebar-item">
                <i class="bi bi-people"></i> Utilisateurs
            </a>
            <a th:href="@{/admin/orders}" class="sidebar-item">
                <i class="bi bi-bag"></i> Commandes
            </a>
        </nav>
        <div class="sidebar-logout">
            <form th:action="@{/logout}" method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button type="submit" class="sidebar-item border-0 bg-transparent w-100 text-start">
                    <i class="bi bi-box-arrow-right"></i> Déconnexion
                </button>
            </form>
        </div>
    </aside>

    <div class="admin-content-area">
        <div class="admin-topbar">
            <div>
                <h1 class="admin-page-title">📦 Articles</h1>
                <p class="admin-page-sub"
                   th:text="${articles.totalElements} + ' articles dans le catalogue'">Articles</p>
            </div>
            <a th:href="@{/admin/articles/new}"
               class="btn btn-primary-custom">
                <i class="bi bi-plus-lg me-2"></i>Nouvel article
            </a>
        </div>

        <div class="admin-body">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="admin-table-card">
                <div class="admin-table-header">
                    <form th:action="@{/admin/articles}" method="get"
                          class="d-flex gap-2">
                        <input type="text" name="search"
                               th:value="${search}"
                               class="form-control search-input"
                               style="max-width:280px;"
                               placeholder="Rechercher un article..."/>
                        <button type="submit"
                                class="btn btn-primary-custom btn-sm">
                            <i class="bi bi-search"></i>
                        </button>
                        <a th:href="@{/admin/articles}"
                           class="btn btn-light btn-sm rounded-pill">Reset</a>
                    </form>
                    <span class="text-muted small">
                        Page <span th:text="${articles.number + 1}">1</span> /
                        <span th:text="${articles.totalPages}">1</span>
                    </span>
                </div>

                <div class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                        <tr>
                            <th>Image</th>
                            <th>Nom</th>
                            <th>Marque</th>
                            <th>Catégorie</th>
                            <th>Prix</th>
                            <th>Stock</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${articles.content.isEmpty()}">
                            <td colspan="8" class="text-center text-muted py-5">
                                Aucun article trouvé
                            </td>
                        </tr>
                        <tr th:each="article : ${articles.content}">
                            <td>
                                <img th:src="${article.imageUrl}"
                                     class="table-thumb"
                                     onerror="this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?w=400'"/>
                            </td>
                            <td>
                                <div class="fw-bold"
                                     th:text="${article.name}">Nom</div>
                                <div class="text-muted small"
                                     th:text="${#strings.abbreviate(article.description,50)}">Desc</div>
                            </td>
                            <td th:text="${article.brand}">Brand</td>
                            <td>
                                <span class="cat-pill"
                                      th:text="${article.category}">Cat</span>
                            </td>
                            <td class="fw-bold" style="color:#e91e8c;"
                                th:text="${#numbers.formatDecimal(article.price ?: 0, 1, 'WHITESPACE', 2, 'COMMA')} + ' €'">
                                0,00 €
                            </td>
                            <td>
                                <span class="badge bg-success"
                                      th:if="${article.stock > 5}"
                                      th:text="${article.stock}">10</span>
                                <span class="badge bg-warning text-dark"
                                      th:if="${article.stock <= 5 and article.stock > 0}"
                                      th:text="${article.stock}">3</span>
                                <span class="badge bg-danger"
                                      th:if="${article.stock == 0}">Rupture</span>
                            </td>
                            <td>
                                <span class="badge bg-success"
                                      th:if="${article.active}">Actif</span>
                                <span class="badge bg-secondary"
                                      th:if="${!article.active}">Inactif</span>
                            </td>
                            <td>
                                <div class="d-flex gap-1">
                                    <a th:href="@{/admin/articles/edit/{id}(id=${article.id})}"
                                       class="btn btn-sm btn-warning rounded-3" title="Modifier">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/articles/delete/{id}(id=${article.id})}"
                                          method="post"
                                          onsubmit="return confirm('Supprimer cet article ?')">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}"/>
                                        <button type="submit"
                                                class="btn btn-sm btn-danger rounded-3"
                                                title="Supprimer">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="p-3 d-flex justify-content-center"
                     th:if="${articles.totalPages > 1}">
                    <ul class="pagination mb-0">
                        <li class="page-item"
                            th:class="${articles.first} ? 'page-item disabled' : 'page-item'">
                            <a class="page-link"
                               th:href="@{/admin/articles(search=${search},page=${articles.number-1})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0,articles.totalPages-1)}"
                            th:class="${i == articles.number} ? 'page-item active' : 'page-item'">
                            <a class="page-link"
                               th:href="@{/admin/articles(search=${search},page=${i})}"
                               th:text="${i+1}">1</a>
                        </li>
                        <li class="page-item"
                            th:class="${articles.last} ? 'page-item disabled' : 'page-item'">
                            <a class="page-link"
                               th:href="@{/admin/articles(search=${search},page=${articles.number+1})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
