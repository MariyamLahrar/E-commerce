<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — ÉléganceShop'">ÉléganceShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/shop}">
            <span style="font-size:1.6rem;">🛍</span>
            <span class="fw-800" style="color:#e91e8c;">Élégance<span style="color:#9c4dcc;">Shop</span></span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/shop}"><i class="bi bi-grid me-1"></i>Boutique</a></li>
                <li class="nav-item" sec:authorize="hasRole('USER')"><a class="nav-link" th:href="@{/favorites}"><i class="bi bi-heart me-1"></i>Favoris</a></li>
                <li class="nav-item" sec:authorize="hasRole('USER')"><a class="nav-link" th:href="@{/orders}"><i class="bi bi-bag me-1"></i>Commandes</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Admin</a></li>
            </ul>
            <ul class="navbar-nav align-items-center gap-2">
                <li class="nav-item" sec:authorize="hasRole('USER')">
                    <a class="nav-link position-relative" th:href="@{/cart}">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="cart-badge" th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}"></span>
                    </a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" data-bs-toggle="dropdown">
                        <div class="user-avatar">
                            <span th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</span>
                        </div>
                        <span class="d-none d-md-inline fw-600 small" sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4">
                        <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item py-2" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard Admin</a></li>
                        <li><hr class="dropdown-divider my-1"/></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="dropdown-item py-2 text-danger"><i class="bi bi-box-arrow-right me-2"></i>Déconnexion</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<aside th:fragment="sidebar" class="admin-sidebar" style="width: 280px; height: 100vh; position: fixed; left: 0; top: 0; background: #1e1e2d; padding: 20px; color: white;">
    <div class="sidebar-brand" style="font-size: 1.5rem; font-weight: bold; margin-bottom: 40px; padding-left: 10px;">
        <i class="bi bi-bag-heart-fill me-2"></i>ÉléganceShop
    </div>

    <div style="text-transform: uppercase; color: #6c757d; font-size: 0.75rem; font-weight: bold; margin: 20px 0 10px 10px; letter-spacing: 1px;">Principal</div>

    <a th:href="@{/admin/dashboard}" class="nav-item-admin"
       th:classappend="${title == 'Dashboard'} ? 'active' : ''"
       style="display: flex; align-items: center; padding: 12px 15px; color: #a2a3b7; text-decoration: none; border-radius: 12px; margin-bottom: 5px;">
        <i class="bi bi-speedometer2 me-3"></i> Dashboard
    </a>

    <a th:href="@{/shop}"
       class="nav-item-admin"
       th:classappend="${title == 'Boutique'} ? 'active' : ''"
       style="display: flex; align-items: center; padding: 12px 15px; color: #a2a3b7; text-decoration: none; border-radius: 12px; margin-bottom: 5px;">
        <i class="bi bi-shop me-3"></i> Voir la boutique
    </a>
    <div style="text-transform: uppercase; color: #6c757d; font-size: 0.75rem; font-weight: bold; margin: 20px 0 10px 10px; letter-spacing: 1px;">Gestion</div>

    <a th:href="@{/admin/articles}" class="nav-item-admin"
       th:classappend="${title == 'Gestion Stock'} ? 'active' : ''"
       style="display: flex; align-items: center; padding: 12px 15px; color: #a2a3b7; text-decoration: none; border-radius: 12px; margin-bottom: 5px;">
        <i class="bi bi-box-seam me-3"></i> Articles
    </a>

    <a th:href="@{/admin/users}" class="nav-item-admin"
       th:classappend="${title == 'Gestion Utilisateurs'} ? 'active' : ''"
       style="display: flex; align-items: center; padding: 12px 15px; color: #a2a3b7; text-decoration: none; border-radius: 12px; margin-bottom: 5px;">
        <i class="bi bi-people me-3"></i> Utilisateurs
    </a>

    <a th:href="@{/admin/orders}" class="nav-item-admin"
       th:classappend="${title == 'Gestion Commandes'} ? 'active' : ''"
       style="display: flex; align-items: center; padding: 12px 15px; color: #a2a3b7; text-decoration: none; border-radius: 12px;">
        <i class="bi bi-cart-check me-3"></i> Commandes
    </a>

    <div style="margin-top: auto; position: absolute; bottom: 20px; width: calc(100% - 40px);">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background: none; border: none; color: #a2a3b7; display: flex; align-items: center; padding: 12px 15px; width: 100%;">
                <i class="bi bi-box-arrow-left me-3"></i> Déconnexion
            </button>
        </form>
    </div>
</aside>

<div th:fragment="flash">
    <div th:if="${successMsg}" class="flash-msg flash-success">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMsg}"></span>
        <button onclick="this.parentElement.remove()" class="flash-close">✕</button>
    </div>
    <div th:if="${errorMsg}" class="flash-msg flash-error">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button onclick="this.parentElement.remove()" class="flash-close">✕</button>
    </div>
</div>

<footer th:fragment="footer" class="site-footer">
    <div class="container text-center">
        <p class="mb-1">🛍 <strong>ÉléganceShop</strong> — Votre boutique de confiance</p>
        <p class="mb-0 opacity-50" style="font-size:.78rem;">© 2026 ÉléganceShop · Spring Boot · Thymeleaf</p>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* CSS additionnel pour la sidebar active */
        .nav-item-admin.active {
            background: linear-gradient(90deg, #d81b60, #ba1a5d) !important;
            color: white !important;
        }
    </style>
</th:block>

</html>
