<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/layout :: head('Mon Panier')}"></th:block>

    <style>
        .cart-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            min-height: 400px;
        }

        .item-row {
            border-bottom: 1px solid #f1f1f1;
            padding: 20px 0;
            transition: background 0.3s;
        }

        .item-row:last-child { border-bottom: none; }

        .item-row:hover { background-color: #fafafa; }

        .qty-input {
            width: 70px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ddd;
            padding: 5px;
        }

        .summary-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 25px;
            position: sticky;
            top: 100px;
        }

        .btn-primary-custom {
            background: linear-gradient(90deg, #e91e8c, #9c4dcc);
            border: none;
            color: white;
            transition: all 0.3s;
        }

        .btn-primary-custom:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-5">
    <div class="row g-4">

        <!-- PANIER -->
        <div class="col-lg-8">
            <div class="cart-container shadow-sm">

                <h2 class="fw-bold mb-4">
                    🛒 Votre Panier
                </h2>

                <!-- PANIER VIDE -->
                <div th:if="${cart == null or cart.items == null or cart.items.isEmpty()}"
                     class="text-center py-5">
                    <div class="display-1 mb-3">🛒</div>
                    <h4 class="text-muted">Votre panier est vide</h4>
                    <p class="mb-4">Ajoutez des produits pour commencer.</p>
                    <a th:href="@{/shop}" class="btn btn-primary-custom rounded-pill px-4">
                        Voir la boutique
                    </a>
                </div>

                <!-- PANIER NON VIDE -->
                <div th:if="${cart != null and cart.items != null and !cart.items.isEmpty()}">

                    <div th:each="item : ${cart.items}" class="item-row row align-items-center">

                        <!-- IMAGE -->
                        <div class="col-3 col-md-2">
                            <img th:src="${item.articleImage}"
                                 class="img-fluid rounded-3 shadow-sm"
                                 style="width:100%; aspect-ratio:1/1; object-fit:cover;"
                                 onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200'">
                        </div>

                        <!-- INFOS -->
                        <div class="col-5 col-md-4">
                            <small class="text-muted text-uppercase fw-bold"
                                   th:text="${item.articleBrand}">Marque</small>

                            <h6 class="fw-bold mb-1"
                                th:text="${item.articleName}">Nom</h6>

                            <span class="text-primary fw-bold"
                                  th:text="${#numbers.formatDecimal(item.unitPrice != null ? item.unitPrice : 0, 1, 'POINT', 2, 'COMMA')} + ' €'">
                                0,00 €
                            </span>
                        </div>

                        <!-- UPDATE -->
                        <div class="col-4 col-md-3">
                            <form th:action="@{/cart/update}" method="post"
                                  class="d-flex align-items-center gap-2">

                                <input type="hidden" name="articleId"
                                       th:value="${item.articleId}">

                                <input type="number" name="quantity"
                                       th:value="${item.quantity}"
                                       min="1"
                                       class="qty-input form-control-sm">

                                <button type="submit"
                                        class="btn btn-sm btn-light border rounded-3 shadow-sm">
                                    🔄
                                </button>
                            </form>
                        </div>

                        <!-- PRIX + DELETE -->
                        <div class="col-12 col-md-3 text-end mt-3 mt-md-0">

                            <div class="fw-bold h6 mb-2"
                                 th:text="${#numbers.formatDecimal(item.subtotal != null ? item.subtotal : 0, 1, 'POINT', 2, 'COMMA')} + ' €'">
                                0,00 €
                            </div>

                            <!-- ✅ FIX ICI -->
                            <form th:action="@{/cart/remove/{itemId}(itemId=${item.id})}" method="post">
                                <button type="submit"
                                        onclick="return confirm('Supprimer cet article ?')"
                                        class="btn btn-sm text-danger border-0 bg-transparent p-0">
                                    🗑 Supprimer
                                </button>
                            </form>

                        </div>

                    </div>

                </div>
            </div>
        </div>

        <!-- RÉSUMÉ -->
        <div class="col-lg-4"
             th:if="${cart != null and cart.items != null and !cart.items.isEmpty()}">

            <div class="summary-card shadow-sm">

                <h4 class="fw-bold mb-4">Résumé</h4>

                <div class="d-flex justify-content-between mb-2">
                    <span>Articles</span>
                    <span th:text="${cart.totalItems != null ? cart.totalItems : 0}">0</span>
                </div>

                <div class="d-flex justify-content-between mb-3 pb-3 border-bottom">
                    <span>Livraison</span>
                    <span class="text-success">Offerte</span>
                </div>

                <div class="d-flex justify-content-between mb-4">
                    <span class="fw-bold">Total</span>
                    <span class="fw-bold text-primary"
                          th:text="${#numbers.formatDecimal(cart.total != null ? cart.total : 0, 1, 'POINT', 2, 'COMMA')} + ' €'">
                        0,00 €
                    </span>
                </div>

                <form th:action="@{/checkout/place-order}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <button type="submit"
                            class="btn btn-primary-custom w-100 py-3 rounded-pill fw-bold">
                        Commander →
                    </button>
                </form>

            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
