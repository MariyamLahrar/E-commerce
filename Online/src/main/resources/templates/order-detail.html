<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Détails de la commande')}"></th:block>
    <style>
        /* Réutilisation de tes styles de badges pour la cohérence */
        .status-badge { border-radius: 20px; padding: 5px 15px; font-size: 0.85rem; font-weight: 600; }
        .status-EN_ATTENTE { background: #fff3cd; color: #856404; }
        .status-VALIDE { background: #d4edda; color: #155724; }
        .status-ANNULEE { background: #f8d7da; color: #721c24; }
        .status-EXPEDIEE { background: #cce5ff; color: #004085; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row">
        <div class="col-12">
            <a th:href="@{/orders}" class="btn btn-sm btn-dark mb-4">
                <i class="bi bi-arrow-left"></i> Retour à mes commandes
            </a>

            <h2 class="fw-bold mb-4">Détails de la commande #<span th:text="${order.id}"></span></h2>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body p-4">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Date :</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>

                            <p><strong>Statut :</strong>
                                <span class="status-badge"
                                      th:classappend="'status-' + ${order.status}"
                                      th:text="${order.status}">Statut</span>
                            </p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Adresse de livraison :</strong> <br>
                                <span class="text-muted" th:text="${order.shippingAddress ?: '12 Rue de la Paix, Paris'}"></span>
                            </p>
                            <p class="h4 text-primary fw-bold">Total :
                                <span th:text="${#numbers.formatDecimal(order.totalAmount ?: 0, 1, 'POINT', 2, 'COMMA')} + ' €'"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <h4 class="fw-bold mb-3">Articles commandés</h4>
            <div class="table-responsive shadow-sm" style="border-radius: 10px; overflow: hidden;">
                <table class="table table-hover align-middle bg-white mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Image</th>
                        <th>Article</th>
                        <th class="text-center">Prix Unitaire</th>
                        <th class="text-center">Quantité</th>
                        <th class="text-end">Sous-total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td>
                            <img th:src="${item.articleImage != null ? item.articleImage : '/images/default-product.png'}"
                                 alt="Produit" class="rounded" style="width: 60px; height: 60px; object-fit: cover;">
                        </td>
                        <td>
                            <span class="fw-bold" th:text="${item.articleName}">Nom Article</span>
                        </td>
                        <td class="text-center" th:text="${item.unitPrice} + ' €'"></td>
                        <td class="text-center">
                            <span class="badge bg-light text-dark border" th:text="${item.quantity}">1</span>
                        </td>
                        <td class="text-end fw-bold" th:text="${(item.unitPrice * item.quantity)} + ' €'"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
