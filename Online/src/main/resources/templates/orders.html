<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Mes Commandes')}"></th:block>
    <style>
        .order-card { border-radius: 15px; border: 1px solid #eee; background: white; transition: 0.3s; }
        .order-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .status-badge { border-radius: 20px; padding: 5px 15px; font-size: 0.85rem; font-weight: 600; }

        /* Classes CSS basées sur ton Enum OrderStatus */
        .status-EN_ATTENTE { background: #fff3cd; color: #856404; }
        .status-VALIDE { background: #d4edda; color: #155724; }
        .status-ANNULEE { background: #f8d7da; color: #721c24; }
        .status-EXPEDIEE { background: #cce5ff; color: #004085; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <h2 class="fw-bold mb-4">📦 Mes Commandes</h2>

    <div th:if="${orders == null or orders.isEmpty()}" class="text-center py-5">
        <div class="display-1 text-muted opacity-25 mb-3">📭</div>
        <h4 class="text-muted">Aucune commande pour le moment.</h4>
        <a th:href="@{/shop}" class="btn btn-primary mt-3">Découvrir nos produits</a>
    </div>

    <div th:if="${orders != null and !orders.isEmpty()}" class="row g-4">
        <div th:each="order : ${orders}" class="col-md-6 col-lg-4">
            <div class="card order-card shadow-sm p-3">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted small"
                          th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm') : 'Date inconnue'}">
                    </span>

                    <span class="status-badge"
                          th:classappend="'status-' + ${order.status}"
                          th:text="${order.status}">Statut</span>
                </div>

                <h6 class="fw-bold">Commande #<span th:text="${order.id}">ID</span></h6>

                <p class="text-muted mb-2">Total :
                    <span class="fw-bold text-primary"
                          th:text="${#numbers.formatDecimal(order.totalAmount ?: 0, 1, 'POINT', 2, 'COMMA')} + ' €'">
                    </span>
                </p>

                <div class="border-top pt-3 mt-2">
                    <p class="small text-muted mb-0">
                        <i class="bi bi-cart3"></i>
                        <span th:text="${order.items != null ? order.items.size() : 0}">0</span> article(s)
                    </p>
                </div>

                <a th:href="@{/orders/detail/{id}(id=${order.id})}" class="btn btn-outline-dark btn-sm rounded-pill mt-3 w-100">
                    Détails de la commande
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
