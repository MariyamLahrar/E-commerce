<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mes Favoris')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-5">
    <h1 class="page-heading mb-4">
        <i class="bi bi-heart-fill me-2" style="color:#e91e8c;"></i>Mes Favoris
    </h1>

    <div th:if="${favorites.isEmpty()}" class="empty-state">
        <div class="empty-icon">❤️</div>
        <h3>Aucun favori</h3>
        <p class="text-muted">Ajoutez des articles à vos favoris depuis la boutique</p>
        <a th:href="@{/shop}" class="btn btn-primary-custom mt-3">
            <i class="bi bi-grid me-2"></i>Explorer la boutique
        </a>
    </div>

    <div th:if="${!favorites.isEmpty()}" class="row g-4">
        <div class="col-6 col-md-4 col-xl-3"
             th:each="article : ${favorites}">
            <div class="article-card">
                <div class="article-img-wrap">
                    <img th:src="${article.imageUrl}"
                         th:alt="${article.name}"
                         class="article-img"
                         onerror="this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?w=400'"/>
                    <span class="article-cat-badge"
                          th:text="${article.category}">Cat</span>
                    <div class="fav-btn-wrap">
                        <form th:action="@{/favorites/remove/{id}(id=${article.id})}"
                              method="post">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="redirect" value="/favorites"/>
                            <button type="submit" class="fav-btn active">
                                <i class="bi bi-heart-fill"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div class="article-body">
                    <div class="article-brand"
                         th:text="${article.brand}">Brand</div>
                    <h3 class="article-name"
                        th:text="${article.name}">Nom</h3>

                    <div class="article-price"
                         th:text="${#numbers.formatDecimal(article.price ?: 0, 1, 'WHITESPACE', 2, 'COMMA')} + ' €'">
                        0,00 €
                    </div>

                    <div class="article-actions mt-3">
                        <form th:if="${article.stock > 0}"
                              th:action="@{/cart/add}" method="post"
                              class="flex-grow-1">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="articleId"
                                   th:value="${article.id}"/>
                            <input type="hidden" name="quantity" value="1"/>
                            <button type="submit"
                                    class="btn btn-primary-custom w-100 btn-sm">
                                <i class="bi bi-cart-plus me-1"></i>Au panier
                            </button>
                        </form>
                        <button th:if="${article.stock == 0}"
                                class="btn btn-secondary w-100 btn-sm" disabled>
                            Indisponible
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
