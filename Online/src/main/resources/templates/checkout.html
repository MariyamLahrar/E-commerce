<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Paiement')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="text-center">
        <h2 class="fw-bold">Finaliser votre commande</h2>
        <p class="text-muted">Récapitulatif de votre achat</p>
    </div>

    <div class="row mt-4">
        <div class="col-md-8 mx-auto">
            <div class="card shadow-sm border-0 p-4" style="border-radius: 20px;">
                <h5>Total à régler : <span class="text-primary fw-bold" th:text="${cart.total + ' €'}"></span></h5>
                <hr>
                <p>Félicitations ! Vous allez recevoir vos articles bientôt.</p>
                <a th:href="@{/shop}" class="btn btn-primary-custom rounded-pill">Retour à la boutique</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
