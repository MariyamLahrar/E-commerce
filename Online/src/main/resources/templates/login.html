<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body class="auth-page">

<div class="auth-card animate-up">
    <div class="auth-logo">🛍</div>
    <h1 class="auth-title">Bon retour !</h1>
    <p class="auth-subtitle">Connectez-vous à votre compte</p>

    <div th:if="${errorMsg}" class="alert-custom alert-error mb-3">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${successMsg}" class="alert-custom alert-success mb-3">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMsg}"></span>
    </div>

    <!-- Comptes démo -->
    <div class="demo-box mb-4">
        <p class="demo-title">🔑 COMPTES DÉMO</p>
        <div class="d-flex gap-3 flex-wrap">
           <div>
            <span class="badge-role admin">ADMIN</span>
            <code>admin / admin123</code>
        </div>
            <div>
                <span class="badge-role user">USER</span>
                <code>user / user123</code>
            </div>
        </div>
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-person me-1"></i>Identifiant
            </label>
            <input type="text" name="username" class="form-control form-control-custom"
                   placeholder="Votre identifiant" required autofocus/>
        </div>
        <div class="mb-4">
            <label class="form-label">
                <i class="bi bi-lock me-1"></i>Mot de passe
            </label>
            <input type="password" name="password"
                   class="form-control form-control-custom"
                   placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </button>
    </form>

    <div class="divider-text">Pas encore de compte ?</div>
    <a th:href="@{/register}" class="btn btn-outline-custom w-100 mt-3">
        <i class="bi bi-person-plus me-2"></i>Créer un compte
    </a>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
